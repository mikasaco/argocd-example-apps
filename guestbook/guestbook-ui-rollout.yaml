apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: guestbook-rollout
spec:
  replicas: 5
  selector:
    matchLabels:
      app: guestbook-ui
  strategy:
    canary:
      canaryService: guestbook-canary
      stableService: guestbook-stable
      steps:
      - setWeight: 20       
      - pause: {}
      - setWeight: 40       
      - pause: {duration: 10}
      - setWeight: 100      
  template:
    metadata:
      labels:
        app: guestbook-ui
    spec:
      containers:
      - name: guestbook-ui
        image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/argoproj/rollouts-demo:green
        ports:
        - containerPort: 80
